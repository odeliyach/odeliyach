<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img" aria-label="Odeliya Charitonova, CS student at Tel Aviv University. Full-stack software engineering, applied ML and NLP, AI automation. Animated pipeline: train, evaluate, serve, automate." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#0a0e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="0" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="452" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#1c272f"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, Menlo, "Courier New", monospace; }
    .box { fill: #131b21; stroke: #243038; stroke-width: 1; }
    .lab { fill: #c4b5fd; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; }
    .kw { fill: #e6edf3; font-size: 16px; }
    .ar { stroke: #a78bfa; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.3; }
    .b1 { animation: glow 8s infinite; }
    .b2 { animation: glow 8s infinite 2s; }
    .b3 { animation: glow 8s infinite 4s; }
    .b4 { animation: glow 8s infinite 6s; }
    .a1 { animation: flow 8s infinite 1.6s; }
    .a2 { animation: flow 8s infinite 3.6s; }
    .a3 { animation: flow 8s infinite 5.6s; }
    .live { animation: blink 1.6s infinite; }
    @keyframes glow {
      0%, 24% { stroke: #2dd4bf; fill: #16262d; }
      32%, 100% { stroke: #243038; fill: #131b21; }
    }
    @keyframes flow {
      0% { opacity: 0.3; }
      8%, 22% { opacity: 1; }
      35%, 100% { opacity: 0.3; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .b1, .b2, .b3, .b4, .a1, .a2, .a3, .live { animation: none; }
      .ar { opacity: 0.8; }
    }
  </style>

  <rect width="900" height="452" rx="14" fill="url(#bg)"/>
  <rect width="900" height="452" rx="14" fill="url(#dots)"/>
  <rect width="900" height="452" rx="14" fill="url(#glow)"/>
  <rect width="900" height="452" rx="14" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="899" height="451" rx="13.5" fill="none" stroke="#243038"/>

  <circle cx="42" cy="30" r="5.5" fill="#ff5f57" opacity="0.8"/>
  <circle cx="61" cy="30" r="5.5" fill="#febc2e" opacity="0.8"/>
  <circle cx="80" cy="30" r="5.5" fill="#28c840" opacity="0.8"/>
  <text x="104" y="35" class="mono" font-size="13" fill="#7d8890">odeliyach / README.md</text>
  <circle class="live" cx="722" cy="30" r="4" fill="#2dd4bf"/>
  <text x="736" y="35" class="mono" font-size="13" fill="#9aa5ad">pipeline running</text>
  <line x1="0" y1="54.5" x2="900" y2="54.5" stroke="url(#line)" stroke-width="1.5"/>

  <text x="450" y="124" text-anchor="middle" class="sans" font-size="56" font-weight="700" fill="#e6edf3" xml:space="preserve">Odeliya <tspan fill="#2dd4bf">Charitonova</tspan></text>
  <text x="450" y="162" text-anchor="middle" class="sans" font-size="22" fill="#d0d7de">CS student at Tel Aviv University</text>
  <text x="450" y="194" text-anchor="middle" class="sans" font-size="17" fill="#9aa5ad" xml:space="preserve">Full-stack Software Engineering<tspan fill="#a78bfa">  ·  </tspan>Applied ML / NLP<tspan fill="#a78bfa">  ·  </tspan>AI Automation</text>

  <g class="sans" text-anchor="middle">
    <rect class="box b1" x="30" y="222" width="156" height="176" rx="10"/>
    <text class="lab" x="108" y="250">01  TRAIN</text>
    <text class="kw" x="108" y="280">PyTorch</text>
    <text class="kw" x="108" y="305">Hugging Face</text>
    <text class="kw" x="108" y="330">Transformers</text>
    <text class="kw" x="108" y="355">scikit-learn</text>
    <text class="kw" x="108" y="380">XGBoost</text>

    <rect class="box b2" x="201" y="222" width="156" height="176" rx="10"/>
    <text class="lab" x="279" y="250">02  EVALUATE</text>
    <text class="kw" x="279" y="280">Pandas</text>
    <text class="kw" x="279" y="305">NumPy</text>
    <text class="kw" x="279" y="330">Grouped CV</text>
    <text class="kw" x="279" y="355">F1 / AUROC</text>
    <text class="kw" x="279" y="380">SLURM HPC</text>

    <rect class="box b3" x="372" y="222" width="156" height="176" rx="10"/>
    <text class="lab" x="450" y="250">03  SERVE</text>
    <text class="kw" x="450" y="280">FastAPI</text>
    <text class="kw" x="450" y="305">React</text>
    <text class="kw" x="450" y="330">TypeScript</text>
    <text class="kw" x="450" y="355">Docker</text>
    <text class="kw" x="450" y="380">GitHub Actions</text>

    <rect class="box b4" x="543" y="222" width="156" height="176" rx="10"/>
    <text class="lab" x="621" y="250">04  AUTOMATE</text>
    <text class="kw" x="621" y="280">n8n</text>
    <text class="kw" x="621" y="305">LLM APIs</text>
    <text class="kw" x="621" y="330">Ollama</text>
    <text class="kw" x="621" y="355">Webhooks</text>
    <text class="kw" x="621" y="380">REST APIs</text>

    <rect x="714" y="222" width="156" height="176" rx="10" fill="#101820" stroke="#4c3f78" stroke-dasharray="4 4"/>
    <text x="792" y="250" font-size="13" font-weight="600" letter-spacing="1.5" fill="#a99fd1">UNDERNEATH</text>
    <text class="kw" x="792" y="280">Linux kernel</text>
    <text class="kw" x="792" y="305">POSIX</text>
    <text class="kw" x="792" y="330">TCP/IP</text>
    <text class="kw" x="792" y="355">pthreads</text>
    <text class="kw" x="792" y="380">GDB / Valgrind</text>
  </g>

  <path class="ar a1" d="M189 310 H198 M194 306 L198 310 L194 314"/>
  <path class="ar a2" d="M360 310 H369 M365 306 L369 310 L365 314"/>
  <path class="ar a3" d="M531 310 H540 M536 306 L540 310 L536 314"/>

  <text x="450" y="430" text-anchor="middle" class="mono" font-size="15" fill="#b9a8fc" xml:space="preserve">Python<tspan fill="#8b7bd8">  ·  </tspan>Java<tspan fill="#8b7bd8">  ·  </tspan>C<tspan fill="#8b7bd8">  ·  </tspan>C#<tspan fill="#8b7bd8">  ·  </tspan>TypeScript<tspan fill="#8b7bd8">  ·  </tspan>SQL<tspan fill="#8b7bd8">  ·  </tspan>Bash<tspan fill="#8b7bd8">  ·  </tspan>Git</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
