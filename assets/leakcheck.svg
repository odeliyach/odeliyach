<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" aria-label="Terminal illustration: a random split reports F1 0.9987 and AUROC 1.00, duplicates are found, and a grouped cross-validation gives AUROC 0.9950 and F1 0.9414." xmlns:c2pa="http://c2pa.org/manifest">
