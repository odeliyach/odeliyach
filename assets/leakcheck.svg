<rect width="900" height="344" rx="14" fill="#0f1419"/><rect x="0.5" y="0.5" width="899" height="343" rx="13.5" fill="none" stroke="#243038"/>
<circle cx="42" cy="30" r="5.5" fill="#ff5f57" opacity="0.8"/><circle cx="61" cy="30" r="5.5" fill="#febc2e" opacity="0.8"/><circle cx="80" cy="30" r="5.5" fill="#28c840" opacity="0.8"/>
<text x="104" y="35" class="m" font-size="13" fill="#7d8890" style="font-size:13px">leak-check · intrusion detection workshop</text>
<line x1="0" y1="54.5" x2="900" y2="54.5" stroke="#1c272f"/>
<text class="m l0" x="44" y="96" xml:space="preserve"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e6edf3">evaluate --split random</tspan></text>
<text class="m l1" x="44" y="124" xml:space="preserve"><tspan fill="#f472b6">  F1 0.9987   AUROC 1.00</tspan><tspan fill="#6b7780">    # suspiciously perfect</tspan></text>
<text class="m l2" x="44" y="162" xml:space="preserve"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e6edf3">check-duplicates</tspan></text>
<text class="m l3" x="44" y="190" xml:space="preserve"><tspan fill="#9aa5ad">  90%+ of feature vectors repeat across both datasets</tspan></text>
<text class="m l4" x="44" y="228" xml:space="preserve"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e6edf3">evaluate --split grouped --folds 5 --repeats 15</tspan></text>
<text class="m l5" x="44" y="256" xml:space="preserve"><tspan fill="#2dd4bf">  AUROC 0.9950 ± 0.0103   F1 0.9414 ± 0.1791</tspan></text>
<text class="m l6" x="44" y="294" xml:space="preserve"><tspan fill="#a78bfa"># The 0.9987 was leakage. Only grouped numbers are reported.</tspan></text>
<text x="856" y="326" text-anchor="end" class="s" font-size="12" fill="#6b7780">four-technique subset · commands are illustrative, numbers are from the report</text>
