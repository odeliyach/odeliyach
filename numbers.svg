<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img" aria-label="258x faster than PyTorch on small networks, 50x lower inference latency, plus 40 points recall on unseen platforms, about 400K items per second queue throughput" xmlns:c2pa="http://c2pa.org/manifest">
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="0.5" y="0.5" width="206" height="99" rx="10" fill="#0f1419" stroke="#243038"/>
    <text x="22" y="52" font-size="32" font-weight="700" fill="#2dd4bf">258x</text>
    <text x="22" y="78" font-size="12" fill="#8b949e">vs PyTorch, small nets (C)</text>

    <rect x="231.5" y="0.5" width="206" height="99" rx="10" fill="#0f1419" stroke="#243038"/>
    <text x="253" y="52" font-size="32" font-weight="700" fill="#2dd4bf">50x</text>
    <text x="253" y="78" font-size="12" fill="#8b949e">lower inference latency</text>

    <rect x="462.5" y="0.5" width="206" height="99" rx="10" fill="#0f1419" stroke="#243038"/>
    <text x="484" y="52" font-size="32" font-weight="700" fill="#2dd4bf">+40 pts</text>
    <text x="484" y="78" font-size="12" fill="#8b949e">recall, unseen platforms</text>

    <rect x="693.5" y="0.5" width="206" height="99" rx="10" fill="#0f1419" stroke="#243038"/>
    <text x="715" y="52" font-size="32" font-weight="700" fill="#2dd4bf">~400K/s</text>
    <text x="715" y="78" font-size="12" fill="#8b949e">queue throughput (C)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
